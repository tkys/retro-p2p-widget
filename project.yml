name: RetroPWidget
options:
  bundleIdPrefix: com.retropwidget
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "F8ZP855SM2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RetroPWidget:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
        excludes:
          - "Resources/Skins/**/*.png"
      - path: Shared/Resources/Skins
        type: folder
        buildPhase: resources
      - path: Fonts
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.retropwidget.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/RetroPWidget.entitlements
    dependencies:
      - target: RetroPWidgetExtension

  RetroPWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
        excludes:
          - "Resources/Skins/**/*.png"
      - path: Shared/Resources/Skins
        type: folder
        buildPhase: resources
      - path: Fonts
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.retropwidget.app.widget
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_ENTITLEMENTS: Widget/RetroPWidgetExtension.entitlements
    dependencies: []
